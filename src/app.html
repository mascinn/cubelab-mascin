<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>cubelab.mascin — Speedcubing Timer</title>
		
		<!-- Google Fonts: Inter & JetBrains Mono -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

		<!-- Anti-FOUC Blocking Theme Script -->
		<script>
			(function() {
				try {
					var stored = localStorage.getItem('cubelab-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (stored === 'dark' || (!stored && prefersDark)) {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#FBFBFD] dark:bg-[#09090B] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white dark:selection:bg-zinc-200 dark:selection:text-zinc-900 transition-colors duration-300">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
