<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded App Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#09090B"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Modern Isometric Rubik's Cube Icon -->
  <g transform="translate(32, 33) scale(0.92)">
    <!-- Top Face (Yellow/White - Crisp Light) -->
    <polygon points="0,-22 19,-11 0,0 -19,-11" fill="#FEF08A" stroke="#09090B" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="-6.33" y1="-7.33" x2="12.67" y2="3.67" stroke="#09090B" stroke-width="1.2"/>
    <line x1="6.33" y1="-7.33" x2="-12.67" y2="3.67" stroke="#09090B" stroke-width="1.2"/>

    <!-- Left Face (Emerald Green / Blue) -->
    <polygon points="-19,-11 0,0 0,22 -19,11" fill="#10B981" stroke="#09090B" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="-12.67" y1="-3.67" x2="-12.67" y2="18.33" stroke="#09090B" stroke-width="1.2"/>
    <line x1="-6.33" y1="3.67" x2="-6.33" y2="25.67" stroke="#09090B" stroke-width="1.2"/>
    <line x1="-19" y1="0" x2="0" y2="11" stroke="#09090B" stroke-width="1.2"/>

    <!-- Right Face (Vibrant Coral Red) -->
    <polygon points="0,0 19,-11 19,11 0,22" fill="#EF4444" stroke="#09090B" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="6.33" y1="3.67" x2="6.33" y2="25.67" stroke="#09090B" stroke-width="1.2"/>
    <line x1="12.67" y1="-3.67" x2="12.67" y2="18.33" stroke="#09090B" stroke-width="1.2"/>
    <line x1="0" y1="11" x2="19" y2="0" stroke="#09090B" stroke-width="1.2"/>
  </g>
</svg>
